    <body class="home-page" data-site-root="./">
        <a class="skip-link" href="#main">본문으로 이동</a>
        <header class="site-header" aria-label="주요 탐색">
            <div class="site-header-inner">
                <a class="brand-link" href="./" aria-label="알한글 홈">
                    <img src="../assets/logo/logo-256.png" alt="" width="30" height="30" />
                    <span>알한글</span>
                </a>
                <nav class="header-actions" aria-label="주요 링크">
                    <a class="header-link" href="updates/" aria-label="업데이트 안내로 이동">업데이트</a>
                    <a class="header-link" href="feedback/" aria-label="문의와 제보 안내로 이동">문의/제보</a>

                </nav>
            </div>
        </header>

        <main class="home-main" id="main">
            <section class="home-shell" aria-labelledby="home-title">
                <div class="home-copy page-enter">
                    <h1 id="home-title">
                        <span class="headline-line">한글 파일은</span>
                        <span class="headline-line">더 이상 <em>낯선 문서</em>가</span>
                        <span class="headline-line">아닙니다.</span>
                    </h1>
                    <p class="home-summary">HWP/HWPX 문서를 열고, 편집하고, 저장하세요.</p>
                    <section class="install-panel" aria-labelledby="install-title">
                        <div class="install-heading">
                            <h2 id="install-title">다운로드</h2>
                            <p data-release-message>첫 공개 릴리스를 준비하고 있습니다.</p>
                        </div>
                        <p class="release-formats" data-release-formats></p>
                        <fieldset class="download-platform-picker">
                            <legend class="visually-hidden">다운로드 플랫폼 선택</legend>
                            <input class="download-platform-radio" type="radio" name="download-platform" id="download-platform-windows" value="windows" checked />
                            <input class="download-platform-radio" type="radio" name="download-platform" id="download-platform-linux" value="linux" />
                            <div class="download-platform-switch">
                                <label for="download-platform-windows">Windows</label>
                                <label for="download-platform-linux">Linux</label>
                            </div>
                            <div class="download-platform-panels">
                                <section class="download-platform-panel windows-panel" aria-labelledby="windows-package-title">
                                    <h3 class="visually-hidden" id="windows-package-title">Windows 다운로드</h3>
                                    <div class="download-package-list" data-package-platform="windows"></div>
                                </section>
                                <section class="download-platform-panel linux-panel" aria-labelledby="linux-package-title">
                                    <h3 class="visually-hidden" id="linux-package-title">Linux 다운로드</h3>
                                    <div class="download-package-list" data-package-platform="linux"></div>
                                </section>
                            </div>
                        </fieldset>
                        <noscript><p><a href="updates/#latest-download">다운로드 및 설치 안내 보기</a></p></noscript>
                        <p class="install-note" data-install-note>공개 전에는 설치 파일 대신 검증 범위와 준비 상태를 안내합니다.</p>
                    </section>
                </div>

                <figure class="home-product page-enter" aria-label="Windows와 Linux 실제 앱과 파일 탐색기 화면">
                    <div class="product-glow" aria-hidden="true"></div>
                    <div class="product-pair" data-product-platform="windows" data-front="editor">
                        <div class="product-stack">
                            <button class="product-shot editor-shot" type="button" data-shot="editor" aria-label="Windows 편집 화면 앞으로 보기" aria-pressed="true">
                                <img src="assets/windows-editor.png" alt="Windows 알한글에서 사업계획서 HWP 원본을 100% 배율로 연 화면" width="1282" height="924" />
                            </button>
                            <button class="product-shot explorer-shot" type="button" data-shot="explorer" aria-label="Windows 파일 탐색기 화면 앞으로 보기" aria-pressed="false">
                                <img src="assets/windows-explorer.png" alt="Windows 파일 탐색기에서 8개 HWP·HWPX 문서의 첫 페이지 썸네일이 보이는 화면" width="1180" height="780" />
                            </button>
                        </div>
                        <div class="product-view-picker" role="group" aria-label="Windows 화면 선택">
                            <button type="button" data-view="editor" aria-pressed="true">편집 화면</button>
                            <button type="button" data-view="explorer" aria-pressed="false">파일 탐색기</button>
                        </div>
                    </div>
                    <div class="product-pair" data-product-platform="linux" data-front="editor" hidden>
                        <div class="product-stack">
                            <button class="product-shot editor-shot" type="button" data-shot="editor" aria-label="Linux 편집 화면 앞으로 보기" aria-pressed="true">
                                <img src="assets/linux-editor.png" alt="Linux 알한글에서 사업계획서 HWP 원본을 100% 배율로 연 화면" width="1282" height="924" />
                            </button>
                            <button class="product-shot explorer-shot" type="button" data-shot="explorer" aria-label="Linux 파일 탐색기 화면 앞으로 보기" aria-pressed="false">
                                <img src="assets/linux-explorer.png" alt="Linux 파일 탐색기에서 8개 HWP·HWPX 문서의 첫 페이지 썸네일이 보이는 화면" width="1180" height="780" />
                            </button>
                        </div>
                        <div class="product-view-picker" role="group" aria-label="Linux 화면 선택">
                            <button type="button" data-view="editor" aria-pressed="true">편집 화면</button>
                            <button type="button" data-view="explorer" aria-pressed="false">파일 탐색기</button>
                        </div>
                    </div>
                    <figcaption class="product-caption">문서 편집부터 파일 탐색기의 미리보기까지.</figcaption>
                </figure>
            </section>
