name: Alhangeul Pages

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Exact 40-character commit SHA to deploy.
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alhangeul-pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy exact Alhangeul Pages source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate exact deploy ref
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$DEPLOY_REF" ]]

      - name: Checkout exact Pages source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deploy_ref }}
          submodules: false

      - name: Verify checked out exact SHA
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$DEPLOY_REF" ]]

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deterministic Pages output
        run: pnpm run build:pages

      - name: Check Pages source and output
        run: pnpm run check:pages

      - name: Test Pages and workflow contracts
        run: node --test tests/pages.test.mjs tests/actions-workflows.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
          static_site_generator: other

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
