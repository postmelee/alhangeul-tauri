name: Alhangeul fresh Windows installer smoke
on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      support_artifact_id:
        type: string
        required: true
      thumbnail_context_experiment:
        type: boolean
        default: false
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
jobs:
  windows-thumbnail-context:
    name: Compare Windows thumbnail context ${{ matrix.replica }}
    if: ${{ inputs.thumbnail_context_experiment }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      ALHANGEUL_CONTEXT_EXPERIMENT: approved
    steps:
      - name: Checkout context experiment source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          submodules: true
      - name: Require exact context source and workflow
        shell: powershell
        env:
          REQUESTED_SHA: ${{ inputs.build_ref || github.sha }}
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $env:REQUESTED_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $sha -cne $env:REQUESTED_SHA -or $sha -cne $env:GITHUB_SHA -or $sha -cne $env:GITHUB_WORKFLOW_SHA) {
            throw 'Context experiment requires the same exact build and workflow SHA.'
          }
          New-Item -ItemType Directory -Path 'diagnostics' -Force | Out-Null
      - name: Download context experiment bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          digest-mismatch: error
          path: artifacts/windows-x64
      - name: Download matching context support reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.support_artifact_id }}
          digest-mismatch: error
          path: artifacts/thumbnail-support
      - name: Test context experiment contracts on Windows
        shell: powershell
        run: .\scripts\windows-thumbnail-context-tests.ps1 -CIConsent
      - name: Run disposable NSIS context comparison
        id: comparison
        shell: powershell
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          & '.\scripts\windows-thumbnail-context-experiment.ps1' `
            -ArtifactRoot 'artifacts\windows-x64' `
            -SupportRoot 'artifacts\thumbnail-support' `
            -OutputDirectory 'diagnostics\windows-thumbnail-context' `
            -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA -CIConsent
      - name: Verify context experiment raw evidence
        if: ${{ !cancelled() && steps.comparison.outcome == 'success' }}
        shell: powershell
        run: .\scripts\windows-thumbnail-context-tests.ps1 -CIConsent -EvidenceDirectory 'diagnostics\windows-thumbnail-context'
      - name: Upload context experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-windows-x64-thumbnail-context-${{ matrix.replica }}
          path: diagnostics/windows-thumbnail-context/**
          if-no-files-found: error
          retention-days: 14

  windows-installer-smoke:
    name: Smoke Windows x64 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nsis
            installer: nsis
            scenario: lifecycle
            artifact: nsis-installer-smoke
          - name: msi
            installer: msi
            scenario: lifecycle
            artifact: msi-installer-smoke
          - name: msi-forced-reinstall
            installer: msi
            scenario: forced-reinstall
            artifact: msi-forced-reinstall
    env:
      INSTALLER_KIND: ${{ matrix.installer }}
      INSTALLER_SCENARIO: ${{ matrix.scenario }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout installer smoke source
        id: smoke-checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          submodules: true

      - name: Prepare installer smoke diagnostics
        if: ${{ always() }}
        shell: powershell
        env:
          REQUESTED_BUILD_REF: ${{ inputs.build_ref || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\windows-installer-smoke'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [ordered]@{
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            requestedBuildRef = $env:REQUESTED_BUILD_REF
            installerKind = $env:INSTALLER_KIND
            scenario = $env:INSTALLER_SCENARIO
            workflowSha = $env:WORKFLOW_SHA
            workflowRef = $env:WORKFLOW_REF
            imageVersion = $env:ImageVersion
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'workflow-context.json') -Encoding UTF8

      - name: Verify installer smoke commit
        id: verify-smoke-commit
        shell: powershell
        env:
          EXPECTED_BUILD_REF: ${{ inputs.build_ref || github.sha }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\windows-installer-smoke'
          $expectedSha = git rev-parse "$env:EXPECTED_BUILD_REF^{commit}"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedSha)) {
            throw "Cannot resolve expected build ref: $env:EXPECTED_BUILD_REF"
          }
          $actualSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($actualSha)) {
            throw "Cannot resolve checked out commit"
          }
          if ($actualSha.Trim() -ne $expectedSha.Trim()) {
            throw "Checked out commit mismatch: $actualSha != $expectedSha"
          }
          Set-Content `
            -LiteralPath (Join-Path $output 'checked-out-sha.txt') `
            -Value $actualSha.Trim() `
            -Encoding UTF8

      - name: Download Windows x64 bundle
        id: download-windows-bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          digest-mismatch: error
          path: artifacts/windows-x64

      - name: Test Windows thumbnail assessment contracts
        id: assessment-tests
        shell: powershell
        run: .\scripts\windows-thumbnail-assessment-tests.ps1

      - name: Download Windows thumbnail support package
        id: download-thumbnail-support
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.support_artifact_id }}
          digest-mismatch: error
          path: artifacts/thumbnail-support

      - name: Test Windows manual thumbnail contracts
        id: manual-tests
        shell: powershell
        run: .\scripts\windows-thumbnail-check-tests.ps1 -SupportRoot 'artifacts\thumbnail-support' -VerifyExitCode

      - name: Run Windows installer smoke
        id: run-installer-smoke
        continue-on-error: true
        shell: powershell
        run: |
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $expectedVersion = [string]$package.version
          if ($expectedVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "MSI ProductVersion requires three components with no prerelease suffix: $expectedVersion"
          }
          & '.\scripts\windows-installer-smoke.ps1' `
            -ArtifactRoot 'artifacts\windows-x64' `
            -OutputDirectory 'diagnostics\windows-installer-smoke' `
            -ExpectedVersion $expectedVersion `
            -InstallerKind $env:INSTALLER_KIND `
            -Scenario $env:INSTALLER_SCENARIO

      - name: Verify thumbnail diagnostic contract
        id: diagnostic-contract
        if: ${{ always() && steps.run-installer-smoke.outcome != 'skipped' }}
        shell: powershell
        run: .\scripts\windows-thumbnail-assessment-tests.ps1 -SummaryPath 'diagnostics\windows-installer-smoke\windows-installer-smoke-summary.json'

      - name: Verify manual thumbnail evidence
        id: manual-evidence
        if: ${{ always() && steps.run-installer-smoke.outcome != 'skipped' }}
        shell: powershell
        run: .\scripts\windows-thumbnail-check-tests.ps1 -SupportRoot 'artifacts\thumbnail-support' -SummaryRoot 'diagnostics\windows-installer-smoke'

      - name: Record installer smoke outcome
        if: ${{ always() }}
        shell: powershell
        env:
          CHECKOUT_OUTCOME: ${{ steps.smoke-checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-smoke-commit.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-windows-bundle.outcome }}
          SMOKE_OUTCOME: ${{ steps.run-installer-smoke.outcome }}
          ASSESSMENT_OUTCOME: ${{ steps.assessment-tests.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic-contract.outcome }}
          SUPPORT_OUTCOME: ${{ steps.download-thumbnail-support.outcome }}
          MANUAL_OUTCOME: ${{ steps.manual-tests.outcome }}
          MANUAL_EVIDENCE_OUTCOME: ${{ steps.manual-evidence.outcome }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\windows-installer-smoke'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [ordered]@{
            checkout = $env:CHECKOUT_OUTCOME
            verifyCommit = $env:VERIFY_OUTCOME
            download = $env:DOWNLOAD_OUTCOME
            smoke = $env:SMOKE_OUTCOME
            assessmentTests = $env:ASSESSMENT_OUTCOME
            diagnosticContract = $env:DIAGNOSTIC_OUTCOME
            supportDownload = $env:SUPPORT_OUTCOME
            manualTests = $env:MANUAL_OUTCOME
            manualEvidence = $env:MANUAL_EVIDENCE_OUTCOME
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'step-outcomes.json') -Encoding UTF8

      - name: Upload installer smoke diagnostics
        id: upload-installer-smoke-diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-desktop-windows-x64-${{ matrix.artifact }}
          path: diagnostics/windows-installer-smoke/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Windows installer smoke success
        if: ${{ always() }}
        shell: powershell
        env:
          CHECKOUT_OUTCOME: ${{ steps.smoke-checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-smoke-commit.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-windows-bundle.outcome }}
          SMOKE_OUTCOME: ${{ steps.run-installer-smoke.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-installer-smoke-diagnostics.outcome }}
          ASSESSMENT_OUTCOME: ${{ steps.assessment-tests.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic-contract.outcome }}
          SUPPORT_OUTCOME: ${{ steps.download-thumbnail-support.outcome }}
          MANUAL_OUTCOME: ${{ steps.manual-tests.outcome }}
          MANUAL_EVIDENCE_OUTCOME: ${{ steps.manual-evidence.outcome }}
        run: |
          $outcomes = [ordered]@{
            checkout = $env:CHECKOUT_OUTCOME
            verifyCommit = $env:VERIFY_OUTCOME
            download = $env:DOWNLOAD_OUTCOME
            smoke = $env:SMOKE_OUTCOME
            uploadDiagnostics = $env:UPLOAD_OUTCOME
            assessmentTests = $env:ASSESSMENT_OUTCOME
            diagnosticContract = $env:DIAGNOSTIC_OUTCOME
            supportDownload = $env:SUPPORT_OUTCOME
            manualTests = $env:MANUAL_OUTCOME
            manualEvidence = $env:MANUAL_EVIDENCE_OUTCOME
          }
          $failed = @($outcomes.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            throw "Windows installer smoke gate failed: $($failed | ConvertTo-Json -Compress)"
          }
