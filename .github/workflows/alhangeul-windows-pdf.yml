name: Task 147 NSIS close comparison (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  close:
    name: NSIS close diagnostic / ${{ matrix.label }}
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            run: '43551469171'
            id: '14098833084'
            sha: 4e99e883eec6bdf9d6ce59070c769f175052fc3f
            digest: 83cef4b9b33dfb48891b075bd5c88800720f9b48955f4a7bf68f35a6174de06e
          - label: candidate
            run: '44758438233'
            id: '14645982560'
            sha: d6350b7b51fea3e58259957e5bae7adece8e9ab3
            digest: 0a97b9b21e214167f67012f39e8f0b20de043b2e27c30a915037206924191955
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate exact ordinary input for diagnosis only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ matrix.run }}
          PRODUCT_ID: ${{ matrix.id }}
          PRODUCT_SHA: ${{ matrix.sha }}
          ZIP_SHA256: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCT_ID" > meta.json
          node -e 'const a=require("./meta.json"); if (a.id !== Number(process.env.PRODUCT_ID) || a.name !== "alhangeul-desktop-windows-x64" || a.expired || a.workflow_run.id !== Number(process.env.PRODUCT_RUN) || a.workflow_run.head_sha !== process.env.PRODUCT_SHA || a.digest !== ("sha256:"+process.env.ZIP_SHA256)) throw Error("artifact metadata mismatch")'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCT_ID/zip" > bundle.zip
          printf '%s  bundle.zip\n' "$ZIP_SHA256" | sha256sum -c -
          unzip -q bundle.zip -d bundle
          node scripts/verify-desktop-artifacts.mjs --platform windows-x64 --root bundle --source-sha "$PRODUCT_SHA" --verify-inventory bundle/alhangeul-artifact-inventory.json
          mkdir -p evidence
          cp meta.json evidence/artifact.json
          printf '%s\n' "$GITHUB_SHA" > evidence/harness-sha.txt
      - name: Run the existing NSIS lifecycle with close samples
        shell: powershell
        run: |
          & scripts/ci/installer-smoke.ps1 -ArtifactRoot bundle -OutputDirectory evidence -ExpectedVersion '0.1.3' -InstallerKind nsis -Scenario lifecycle
      - name: Preserve raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nsis-close-diagnostic-${{ matrix.label }}
          path: evidence
          if-no-files-found: error
