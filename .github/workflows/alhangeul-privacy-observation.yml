name: Alhangeul privacy runtime observation
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: both
        options: [both, linux, windows]
        description: Observe selected OS; reuse successful evidence for unchanged OS.
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux' && '[{"os":"ubuntu-22.04","platform":"linux"}]' || inputs.platform == 'windows' && '[{"os":"windows-2025","platform":"windows"}]' || '[{"os":"ubuntu-22.04","platform":"linux"},{"os":"windows-2025","platform":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download and verify exact public v0.1.3 bytes
        run: node scripts/privacy/prepare.mjs ${{ matrix.platform }}
      - name: Prepare Linux runtime only
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 dbus-x11 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb openbox strace imagemagick fonts-noto-cjk
      - name: Observe Linux startup and idle connections
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/privacy/observe-linux.sh
      - name: Observe Windows startup and idle connections
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/privacy/observe-windows.ps1
      - name: Preserve metadata and screenshots only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privacy-observation-${{ matrix.platform }}
          path: |
            privacy-evidence/*.json
            privacy-evidence/*.txt
            privacy-evidence/*.png
          retention-days: 7
          if-no-files-found: error
