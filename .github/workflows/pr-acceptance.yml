name: Alhangeul PR acceptance

on:
  pull_request:
    branches: [devel]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: alhangeul-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    uses: ./.github/workflows/alhangeul-ci-fast.yml
    with:
      source_ref: ${{ github.sha }}

  required:
    name: Alhangeul PR required
    if: ${{ always() }}
    needs: [contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Require every fast contract job
        env:
          PR_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/pr-acceptance.mjs
