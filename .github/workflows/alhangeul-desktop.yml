name: Alhangeul Desktop Artifact Build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch, tag, or commit to build. Empty uses the selected workflow commit.
        required: false
        default: ""
        type: string
      run_tests:
        description: Run platform-neutral tests before the native build.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: alhangeul-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "24"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle_args: ""
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: ""
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle_args: "--bundles deb"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          submodules: true

      - name: Verify checked out commit
        shell: bash
        env:
          EXPECTED_BUILD_REF: ${{ inputs.build_ref || github.sha }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse "${EXPECTED_BUILD_REF}^{commit}")"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Checked out commit mismatch: $actual_sha != $expected_sha" >&2
            exit 1
          fi
          echo "Building commit: $actual_sha"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            rpm \
            shared-mime-info \
            time \
            xdg-utils \
            zip

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Fetch rhwp pinned release tag
        if: inputs.run_tests
        run: pnpm run fetch:rhwp-pin-tag

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: desktop-${{ matrix.name }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            desktop-${{ matrix.name }}-pnpm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            third_party/rhwp/target
          key: desktop-${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            desktop-${{ matrix.name }}-cargo-

      - name: Prepare Windows thumbnail core diagnostics
        if: matrix.name == 'windows-x64'
        shell: powershell
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\thumbnail-core'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [ordered]@{
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            repositorySha = (git rev-parse HEAD).Trim()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'workflow-context.json') -Encoding UTF8

      - name: Build Windows thumbnail core probe
        id: build-thumbnail-core-probe
        if: matrix.name == 'windows-x64'
        continue-on-error: true
        shell: powershell
        run: cargo build --manifest-path third_party/rhwp/Cargo.toml --locked --bin rhwp --release

      - name: Run Windows thumbnail core probe
        id: run-thumbnail-core-probe
        if: matrix.name == 'windows-x64' && steps.build-thumbnail-core-probe.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          & '.\scripts\benchmark-thumbnail-core.ps1' `
            -RhwpBinary 'third_party\rhwp\target\release\rhwp.exe' `
            -FixtureRoot 'third_party\rhwp\saved' `
            -OutputDirectory 'diagnostics\thumbnail-core'

      - name: Record Windows thumbnail core probe outcome
        if: ${{ always() && matrix.name == 'windows-x64' }}
        shell: powershell
        env:
          BUILD_OUTCOME: ${{ steps.build-thumbnail-core-probe.outcome }}
          PROBE_OUTCOME: ${{ steps.run-thumbnail-core-probe.outcome }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\thumbnail-core'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [ordered]@{
            build = $env:BUILD_OUTCOME
            probe = $env:PROBE_OUTCOME
            repositorySha = (git rev-parse HEAD).Trim()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'step-outcomes.json') -Encoding UTF8

      - name: Upload Windows thumbnail core diagnostics
        id: upload-thumbnail-core-diagnostics
        if: ${{ always() && matrix.name == 'windows-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-windows-x64-thumbnail-core
          path: diagnostics/thumbnail-core/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Windows thumbnail core probe success
        if: ${{ always() && matrix.name == 'windows-x64' }}
        shell: powershell
        env:
          BUILD_OUTCOME: ${{ steps.build-thumbnail-core-probe.outcome }}
          PROBE_OUTCOME: ${{ steps.run-thumbnail-core-probe.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-thumbnail-core-diagnostics.outcome }}
        run: |
          $outcomes = [ordered]@{
            build = $env:BUILD_OUTCOME
            probe = $env:PROBE_OUTCOME
            uploadDiagnostics = $env:UPLOAD_OUTCOME
          }
          $failed = @($outcomes.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            throw "Windows thumbnail core probe gate failed: $($failed | ConvertTo-Json -Compress)"
          }

      - name: Prepare Linux thumbnail core diagnostics
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/thumbnail-core-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"runId":"%s","runAttempt":"%s","repositorySha":"%s","runner":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(git rev-parse HEAD)" "${{ matrix.name }}" \
            > "$OUTPUT_ROOT/workflow-context.json"

      - name: Run Linux thumbnail core probe
        id: run-linux-thumbnail-core-probe
        if: startsWith(matrix.name, 'linux-')
        continue-on-error: true
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/thumbnail-core-${{ matrix.name }}
        run: |
          ./scripts/benchmark-linux-thumbnail-core.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/third_party/rhwp/saved" \
            "$OUTPUT_ROOT"

      - name: Record Linux thumbnail core probe outcome
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/thumbnail-core-${{ matrix.name }}
          PROBE_OUTCOME: ${{ steps.run-linux-thumbnail-core-probe.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"probe":"%s","repositorySha":"%s","runner":"%s"}\n' \
            "$PROBE_OUTCOME" "$(git rev-parse HEAD)" "${{ matrix.name }}" \
            > "$OUTPUT_ROOT/step-outcomes.json"

      - name: Upload Linux thumbnail core diagnostics
        id: upload-linux-thumbnail-core-diagnostics
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnail-core
          path: diagnostics/thumbnail-core-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Linux thumbnail core probe success
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.run-linux-thumbnail-core-probe.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-linux-thumbnail-core-diagnostics.outcome }}
        run: |
          set -euo pipefail
          [[ "$PROBE_OUTCOME" == success ]]
          [[ "$UPLOAD_OUTCOME" == success ]]

      - name: Prepare Linux thumbnailer evidence
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"

      - name: Build Linux thumbnailer
        id: build-linux-thumbnailer
        if: startsWith(matrix.name, 'linux-')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:linux-thumbnailer -- \
            --target "${{ matrix.target }}" \
            --output "diagnostics/linux-thumbnailer-${{ matrix.name }}" \
            --repository-sha "$(git rev-parse HEAD)"

      - name: Record Linux thumbnailer build outcome
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-${{ matrix.name }}
          BUILD_OUTCOME: ${{ steps.build-linux-thumbnailer.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"build":"%s","repositorySha":"%s","runner":"%s"}\n' \
            "$BUILD_OUTCOME" "$(git rev-parse HEAD)" "${{ matrix.name }}" \
            > "$OUTPUT_ROOT/step-outcomes.json"

      - name: Upload Linux thumbnailer evidence
        id: upload-linux-thumbnailer-evidence
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnailer
          path: diagnostics/linux-thumbnailer-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Linux thumbnailer build success
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build-linux-thumbnailer.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-linux-thumbnailer-evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "$BUILD_OUTCOME" == success ]]
          [[ "$UPLOAD_OUTCOME" == success ]]

      - name: Stage Linux thumbnailer package resources
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0755 \
            "diagnostics/linux-thumbnailer-${{ matrix.name }}/alhangeul-thumbnailer" \
            apps/desktop/src-tauri/linux/thumbnail-resources/alhangeul-thumbnailer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check product boundary
        if: inputs.run_tests
        run: pnpm run check:product-boundary

      - name: Check product version
        if: inputs.run_tests
        run: pnpm run check:product-version

      - name: Check release metadata
        if: inputs.run_tests
        run: pnpm run check:release-metadata

      - name: Verify rhwp pin
        if: inputs.run_tests
        run: pnpm run check:rhwp-pin

      - name: Test automation contracts
        if: inputs.run_tests
        run: pnpm run test:automation

      - name: Test upstream integration
        if: inputs.run_tests
        run: pnpm run test:upstream

      - name: Test studio host
        if: inputs.run_tests
        run: pnpm run test:studio

      - name: Test document preview Rust
        if: inputs.run_tests
        run: pnpm run test:document-preview

      - name: Lint document preview Rust
        if: inputs.run_tests
        run: pnpm run clippy:document-preview

      - name: Lint document preview protocol-only Rust
        if: inputs.run_tests
        run: pnpm run clippy:document-preview:protocol

      - name: Test Linux thumbnailer
        id: test-linux-thumbnailer
        if: inputs.run_tests && startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          pnpm run test:linux-thumbnailer 2>&1 | tee "$OUTPUT_ROOT/tests.log"

      - name: Lint Linux thumbnailer
        id: lint-linux-thumbnailer
        if: inputs.run_tests && startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          cargo fmt --manifest-path apps/linux-thumbnailer/Cargo.toml -- --check 2>&1 | tee "$OUTPUT_ROOT/fmt.log"
          pnpm run clippy:linux-thumbnailer 2>&1 | tee "$OUTPUT_ROOT/clippy.log"

      - name: Record Linux thumbnailer test outcome
        if: ${{ always() && inputs.run_tests && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}
          TEST_OUTCOME: ${{ steps.test-linux-thumbnailer.outcome }}
          LINT_OUTCOME: ${{ steps.lint-linux-thumbnailer.outcome }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_NAME: ${{ matrix.name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"schemaVersion":1,"repositorySha":"%s","workflowSha":"%s","runId":"%s","runAttempt":"%s","runner":"%s","target":"%s","test":"%s","lint":"%s"}\n' \
            "$(git rev-parse HEAD)" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_NAME" "$BUILD_TARGET" "$TEST_OUTCOME" "$LINT_OUTCOME" \
            > "$OUTPUT_ROOT/step-outcomes.json"

      - name: Upload Linux thumbnailer test evidence
        if: ${{ always() && inputs.run_tests && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnailer-tests
          path: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows thumbnail binaries
        if: matrix.name == 'windows-x64'
        run: pnpm run build:thumbnail-binaries -- --target x86_64-pc-windows-msvc

      - name: Test desktop Rust
        if: inputs.run_tests
        run: pnpm run test:desktop

      - name: Lint desktop Rust
        if: inputs.run_tests
        run: pnpm run clippy:desktop

      - name: Test Windows thumbnail worker
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run test:thumbnail-worker:windows

      - name: Test Windows thumbnail handler
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run test:thumbnail-handler:windows

      - name: Lint Windows thumbnail worker
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run clippy:thumbnail-worker:windows

      - name: Lint Windows thumbnail handler
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run clippy:thumbnail-handler:windows

      - name: Build Tauri bundles
        shell: bash
        run: pnpm tauri build --verbose --target "${{ matrix.target }}" ${{ matrix.bundle_args }}

      - name: Prepare Linux thumbnail package diagnostics
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnail-package-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"

      - name: Run Linux thumbnail package lifecycle
        id: linux-thumbnail-package-smoke
        if: startsWith(matrix.name, 'linux-')
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          ALHANGEUL_PACKAGE_SMOKE_ALLOW_SYSTEM: "1"
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          OUTPUT_ROOT: diagnostics/linux-thumbnail-package-${{ matrix.name }}
        run: |
          set -euo pipefail
          evidence="$BUNDLE_ROOT/verification/linux-thumbnail-packages.json"
          bash scripts/linux-thumbnail-mime-smoke.sh "$GITHUB_WORKSPACE" "$OUTPUT_ROOT/mime-canary.json" \
            2>&1 | tee "$OUTPUT_ROOT/mime-canary.log"
          bash scripts/linux-thumbnail-package-smoke.sh \
            --platform "${{ matrix.name }}" \
            --bundle-root "$BUNDLE_ROOT" \
            --helper apps/desktop/src-tauri/linux/thumbnail-resources/alhangeul-thumbnailer \
            --repository-sha "$(git rev-parse HEAD)" \
            --evidence "$evidence" \
            2>&1 | tee "$OUTPUT_ROOT/lifecycle.log"
          cp "$evidence" "$OUTPUT_ROOT/"

      - name: Record Linux thumbnail package outcome
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnail-package-${{ matrix.name }}
          SMOKE_OUTCOME: ${{ steps.linux-thumbnail-package-smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"smoke":"%s","repositorySha":"%s","runner":"%s"}\n' \
            "$SMOKE_OUTCOME" "$(git rev-parse HEAD)" "${{ matrix.name }}" \
            > "$OUTPUT_ROOT/step-outcomes.json"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/verification"
          if [[ -d "$bundle" ]]; then
            find "$bundle" -maxdepth 1 -name 'linux-thumbnail-packages.json*' -exec cp {} "$OUTPUT_ROOT/" \;
          fi

      - name: Upload Linux thumbnail package evidence
        id: upload-linux-thumbnail-package-evidence
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnail-package
          path: diagnostics/linux-thumbnail-package-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Linux thumbnail package success
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.linux-thumbnail-package-smoke.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-linux-thumbnail-package-evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_OUTCOME" == success ]]
          [[ "$UPLOAD_OUTCOME" == success ]]

      - name: Stage Windows thumbnail verification copies
        if: matrix.name == 'windows-x64'
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_ROOT/verification"
          cp \
            apps/desktop/src-tauri/windows/thumbnail-resources/AlhangeulThumbnailHandler.dll \
            "$BUNDLE_ROOT/verification/AlhangeulThumbnailHandler.dll"
          cp \
            apps/desktop/src-tauri/windows/thumbnail-resources/AlhangeulThumbnailWorker.exe \
            "$BUNDLE_ROOT/verification/AlhangeulThumbnailWorker.exe"

      - name: Verify bundle artifact
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          pnpm run check:desktop-artifacts -- \
            --platform "${{ matrix.name }}" \
            --root "$BUNDLE_ROOT" \
            --write-inventory "$BUNDLE_ROOT/alhangeul-artifact-inventory.json"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-desktop-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  windows-installer-smoke:
    name: Smoke Windows x64 installers
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout installer smoke source
        id: smoke-checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          submodules: true

      - name: Prepare installer smoke diagnostics
        if: ${{ always() }}
        shell: powershell
        env:
          REQUESTED_BUILD_REF: ${{ inputs.build_ref || github.sha }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\windows-installer-smoke'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [ordered]@{
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            requestedBuildRef = $env:REQUESTED_BUILD_REF
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'workflow-context.json') -Encoding UTF8

      - name: Verify installer smoke commit
        id: verify-smoke-commit
        shell: powershell
        env:
          EXPECTED_BUILD_REF: ${{ inputs.build_ref || github.sha }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\windows-installer-smoke'
          $expectedSha = git rev-parse "$env:EXPECTED_BUILD_REF^{commit}"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedSha)) {
            throw "Cannot resolve expected build ref: $env:EXPECTED_BUILD_REF"
          }
          $actualSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($actualSha)) {
            throw "Cannot resolve checked out commit"
          }
          if ($actualSha.Trim() -ne $expectedSha.Trim()) {
            throw "Checked out commit mismatch: $actualSha != $expectedSha"
          }
          Set-Content `
            -LiteralPath (Join-Path $output 'checked-out-sha.txt') `
            -Value $actualSha.Trim() `
            -Encoding UTF8

      - name: Download Windows x64 bundle
        id: download-windows-bundle
        uses: actions/download-artifact@v8
        with:
          name: alhangeul-desktop-windows-x64
          path: artifacts/windows-x64

      - name: Run Windows installer smoke
        id: run-installer-smoke
        continue-on-error: true
        shell: powershell
        run: |
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $expectedVersion = [string]$package.version
          if ($expectedVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "MSI ProductVersion requires three components with no prerelease suffix: $expectedVersion"
          }
          & '.\scripts\windows-installer-smoke.ps1' `
            -ArtifactRoot 'artifacts\windows-x64' `
            -OutputDirectory 'diagnostics\windows-installer-smoke' `
            -ExpectedVersion $expectedVersion

      - name: Record installer smoke outcome
        if: ${{ always() }}
        shell: powershell
        env:
          CHECKOUT_OUTCOME: ${{ steps.smoke-checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-smoke-commit.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-windows-bundle.outcome }}
          SMOKE_OUTCOME: ${{ steps.run-installer-smoke.outcome }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\windows-installer-smoke'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [ordered]@{
            checkout = $env:CHECKOUT_OUTCOME
            verifyCommit = $env:VERIFY_OUTCOME
            download = $env:DOWNLOAD_OUTCOME
            smoke = $env:SMOKE_OUTCOME
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'step-outcomes.json') -Encoding UTF8

      - name: Upload installer smoke diagnostics
        id: upload-installer-smoke-diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-desktop-windows-x64-installer-smoke
          path: diagnostics/windows-installer-smoke/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Windows installer smoke success
        if: ${{ always() }}
        shell: powershell
        env:
          CHECKOUT_OUTCOME: ${{ steps.smoke-checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-smoke-commit.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-windows-bundle.outcome }}
          SMOKE_OUTCOME: ${{ steps.run-installer-smoke.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-installer-smoke-diagnostics.outcome }}
        run: |
          $outcomes = [ordered]@{
            checkout = $env:CHECKOUT_OUTCOME
            verifyCommit = $env:VERIFY_OUTCOME
            download = $env:DOWNLOAD_OUTCOME
            smoke = $env:SMOKE_OUTCOME
            uploadDiagnostics = $env:UPLOAD_OUTCOME
          }
          $failed = @($outcomes.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            throw "Windows installer smoke gate failed: $($failed | ConvertTo-Json -Compress)"
          }
