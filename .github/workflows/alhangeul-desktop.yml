name: Alhangeul Desktop Artifact Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build ordinary, stable updater, or test-only updater acceptance artifacts.
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - updater
          - updater-acceptance
          - updater-native-acceptance
          - updater-native-negative-acceptance
          - updater-linux-window-probe
          - updater-linux-window-verify
      build_ref:
        description: Artifact mode requires a ref resolving to the selected workflow commit; other modes accept branch/tag/commit. Empty uses the workflow commit.
        required: false
        default: ""
        type: string
      run_tests:
        description: Run native Rust tests and lints; fast contracts always run for ordinary artifacts.
        required: true
        default: true
        type: boolean
      artifact_platform:
        description: Ordinary artifact platform scope (partial unless all).
        type: choice
        default: all
        options: [all, windows-x64, linux, linux-x64, linux-arm64]
      validation_profile:
        description: Full gates, product build only, or isolated core probes.
        type: choice
        default: full
        options: [full, product, core]
      release_version:
        description: Stable semantic version for updater mode.
        required: false
        default: ""
        type: string
      release_tag:
        description: Exact v-prefixed tag matching release_version.
        required: false
        default: ""
        type: string
      release_notes:
        description: Release notes used only by the approved publish job.
        required: false
        default: ""
        type: string
      publish_release:
        description: Publish the verified updater artifacts to GitHub Releases.
        required: true
        default: false
        type: boolean
      acceptance_candidate_sha:
        description: Exact D1 source SHA embedded in test N and N+1 artifacts.
        required: false
        default: ""
        type: string
      acceptance_d1_run_id:
        description: Successful nonpublishing updater acceptance run ID.
        required: false
        default: ""
        type: string
      acceptance_candidate_artifact_id:
        description: Approved updater acceptance candidate artifact ID.
        required: false
        default: ""
        type: string
      acceptance_candidate_artifact_digest:
        description: Approved sha256-prefixed candidate archive digest.
        required: false
        default: ""
        type: string
      acceptance_release_tag:
        description: Approved test-only updater prerelease tag.
        required: false
        default: ""
        type: string
      acceptance_negative_scenario:
        description: Approved test-only negative manifest scenario.
        required: false
        default: ""
        type: string
      acceptance_manifest_sha256:
        description: Exact negative scenario manifest SHA-256.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: alhangeul-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "24"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  artifact:
    if: ${{ inputs.mode == 'artifact' }}
    uses: ./.github/workflows/alhangeul-artifacts.yml
    with:
      build_ref: ${{ inputs.build_ref || github.sha }}
      platform: ${{ inputs.artifact_platform }}
      profile: ${{ inputs.validation_profile }}
      run_tests: ${{ inputs.run_tests }}

  build-updater:
    name: Build updater ${{ matrix.name }}
    if: ${{ inputs.mode == 'updater' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            updater_targets: windows-x86_64-nsis,windows-x86_64-msi
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            updater_targets: linux-x86_64-appimage
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 90
    steps:
      - name: Validate exact updater inputs
        shell: bash
        env:
          BUILD_REF: ${{ inputs.build_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_REF" == "$WORKFLOW_SHA" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          [[ -n "$RELEASE_NOTES" ]]

      - name: Checkout exact updater source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref }}
          submodules: true

      - name: Verify updater source SHA
        shell: bash
        env:
          BUILD_REF: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify tracked updater release config
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATER_CONFIG: ${{ github.workspace }}/apps/desktop/src-tauri/tauri.updater.conf.json
        run: |
          set -euo pipefail
          pnpm run check:product-version
          pnpm run check:release-metadata
          source_version="$(node -p "require('./package.json').version")"
          [[ "$source_version" == "$RELEASE_VERSION" ]]
          public_key="$(node -p "require(process.env.UPDATER_CONFIG).plugins.updater.pubkey")"
          [[ -n "$public_key" ]]
          printf 'TAURI_UPDATER_PUBLIC_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"

      - name: Build signed updater bundles
        shell: bash
        env:
          UPDATER_CONFIG: ${{ github.workspace }}/apps/desktop/src-tauri/tauri.updater.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri build --verbose \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "$UPDATER_CONFIG"

      - name: Verify updater artifact slice
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          pnpm run check:updater-artifacts -- \
            --root "$BUNDLE_ROOT" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --targets "${{ matrix.updater_targets }}" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY

      - name: Upload verified updater artifact slice
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-updater-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  build-updater-acceptance:
    name: Build updater acceptance ${{ matrix.role }} ${{ matrix.name }}
    if: ${{ inputs.mode == 'updater-acceptance' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: n
            version: 99.1.0
            name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            updater_targets: windows-x86_64-nsis,windows-x86_64-msi
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          - role: n
            version: 99.1.0
            name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            updater_targets: linux-x86_64-appimage
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          - role: n-plus-one
            version: 99.1.1
            name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            updater_targets: windows-x86_64-nsis,windows-x86_64-msi
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          - role: n-plus-one
            version: 99.1.1
            name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            updater_targets: linux-x86_64-appimage
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 90
    steps:
      - name: Validate exact updater acceptance inputs
        shell: bash
        env:
          BUILD_REF: ${{ inputs.build_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ACCEPTANCE_ROLE: ${{ matrix.role }}
          ACCEPTANCE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_REF" == "$WORKFLOW_SHA" ]]
          [[ -z "$RELEASE_VERSION" ]]
          [[ -z "$RELEASE_TAG" ]]
          [[ -z "$RELEASE_NOTES" ]]
          [[ "$PUBLISH_RELEASE" == "false" ]]
          case "$ACCEPTANCE_ROLE:$ACCEPTANCE_VERSION" in
            n:99.1.0|n-plus-one:99.1.1) ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact updater acceptance source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref }}
          submodules: true

      - name: Verify updater acceptance source SHA
        shell: bash
        env:
          BUILD_REF: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]

      - name: Install updater acceptance Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Setup updater acceptance Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable updater acceptance pnpm
        run: corepack enable

      - name: Install updater acceptance exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup updater acceptance Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Create external updater acceptance config
        shell: bash
        env:
          ACCEPTANCE_ROLE: ${{ matrix.role }}
          ACCEPTANCE_VERSION: ${{ matrix.version }}
          TRACKED_UPDATER_CONFIG: ${{ github.workspace }}/apps/desktop/src-tauri/tauri.updater.conf.json
          UPDATER_CONFIG: ${{ runner.temp }}/alhangeul-updater-acceptance-${{ matrix.role }}.json
        run: |
          set -euo pipefail
          pnpm run check:product-version
          pnpm run check:release-metadata
          public_key="$(node -p "require(process.env.TRACKED_UPDATER_CONFIG).plugins.updater.pubkey")"
          [[ -n "$public_key" ]]
          export TAURI_UPDATER_PUBLIC_KEY="$public_key"
          printf 'TAURI_UPDATER_PUBLIC_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"
          printf 'UPDATER_ACCEPTANCE_CONFIG=%s\n' "$UPDATER_CONFIG" >> "$GITHUB_ENV"
          pnpm run build:updater-acceptance-config -- \
            --root "$GITHUB_WORKSPACE" \
            --output "$UPDATER_CONFIG" \
            --role "$ACCEPTANCE_ROLE" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY
          [[ "$(node -p "require(process.env.UPDATER_CONFIG).version")" == "$ACCEPTANCE_VERSION" ]]

      - name: Build signed updater acceptance bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri build --verbose \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --config "$UPDATER_ACCEPTANCE_CONFIG"

      - name: Verify updater acceptance artifact slice
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          ACCEPTANCE_ROLE: ${{ matrix.role }}
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          pnpm run check:updater-acceptance -- \
            --root "$BUNDLE_ROOT" \
            --role "$ACCEPTANCE_ROLE" \
            --source-sha "$SOURCE_SHA" \
            --targets "${{ matrix.updater_targets }}" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY

      - name: Upload verified updater acceptance slice
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-updater-acceptance-${{ matrix.role }}-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  verify-updater-acceptance:
    name: Verify nonpublishing updater acceptance candidate
    needs: build-updater-acceptance
    if: ${{ inputs.mode == 'updater-acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact updater acceptance inventory source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref }}
          submodules: false

      - name: Verify updater acceptance inventory source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Setup updater acceptance inventory Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable updater acceptance inventory pnpm
        run: corepack enable

      - name: Install updater acceptance inventory dependencies
        run: pnpm install --frozen-lockfile

      - name: Read tracked updater acceptance public key
        shell: bash
        env:
          TRACKED_UPDATER_CONFIG: ${{ github.workspace }}/apps/desktop/src-tauri/tauri.updater.conf.json
        run: |
          set -euo pipefail
          pnpm run check:release-metadata
          public_key="$(node -p "require(process.env.TRACKED_UPDATER_CONFIG).plugins.updater.pubkey")"
          [[ -n "$public_key" ]]
          printf 'TAURI_UPDATER_PUBLIC_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"

      - name: Download updater acceptance N Windows slice
        uses: actions/download-artifact@v8
        with:
          name: alhangeul-updater-acceptance-n-windows-x64
          path: updater-acceptance/n

      - name: Download updater acceptance N Linux slice
        uses: actions/download-artifact@v8
        with:
          name: alhangeul-updater-acceptance-n-linux-x64
          path: updater-acceptance/n

      - name: Download updater acceptance N+1 Windows slice
        uses: actions/download-artifact@v8
        with:
          name: alhangeul-updater-acceptance-n-plus-one-windows-x64
          path: updater-acceptance/n-plus-one

      - name: Download updater acceptance N+1 Linux slice
        uses: actions/download-artifact@v8
        with:
          name: alhangeul-updater-acceptance-n-plus-one-linux-x64
          path: updater-acceptance/n-plus-one

      - name: Create updater acceptance N inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          pnpm run check:updater-acceptance -- \
            --root updater-acceptance/n \
            --role n \
            --source-sha "$SOURCE_SHA" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY \
            --write-inventory updater-acceptance-output/alhangeul-updater-test-n-inventory.json

      - name: Create updater acceptance N+1 candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          source_timestamp="$(git show -s --format=%cI HEAD)"
          pnpm run check:updater-acceptance -- \
            --root updater-acceptance/n-plus-one \
            --role n-plus-one \
            --source-sha "$SOURCE_SHA" \
            --source-timestamp "$source_timestamp" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY \
            --write-inventory updater-acceptance-output/alhangeul-updater-test-inventory.json \
            --write-manifest updater-acceptance-output/alhangeul-updater-test.json
          mapfile -t assets < <(find updater-acceptance/n-plus-one updater-acceptance-output \
            -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' \
              -o -name '*.sig' -o -name 'alhangeul-updater-test-inventory.json' \
              -o -name 'alhangeul-updater-test.json' \) -print | sort)
          [[ "${#assets[@]}" -eq 8 ]]
          ! printf '%s\n' "${assets[@]}" | grep -q '99\.1\.0'

      - name: Upload updater acceptance N inventory
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-updater-acceptance-n-inventory
          path: updater-acceptance-output/alhangeul-updater-test-n-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload updater acceptance public candidate
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-updater-acceptance-candidate
          path: |
            updater-acceptance/n-plus-one/**/*.msi
            updater-acceptance/n-plus-one/**/*.msi.sig
            updater-acceptance/n-plus-one/**/*-setup.exe
            updater-acceptance/n-plus-one/**/*-setup.exe.sig
            updater-acceptance/n-plus-one/**/*.AppImage
            updater-acceptance/n-plus-one/**/*.AppImage.sig
            updater-acceptance-output/alhangeul-updater-test-inventory.json
            updater-acceptance-output/alhangeul-updater-test.json
          if-no-files-found: error
          retention-days: 14

  verify-updater-release:
    name: Verify complete updater release inventory
    needs: build-updater
    if: ${{ inputs.mode == 'updater' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact inventory source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref }}
          submodules: false

      - name: Verify updater inventory source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Read tracked updater public key
        shell: bash
        env:
          UPDATER_CONFIG: ${{ github.workspace }}/apps/desktop/src-tauri/tauri.updater.conf.json
        run: |
          set -euo pipefail
          pnpm run check:release-metadata
          public_key="$(node -p "require(process.env.UPDATER_CONFIG).plugins.updater.pubkey")"
          [[ -n "$public_key" ]]
          printf 'TAURI_UPDATER_PUBLIC_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"

      - name: Download verified updater slices
        uses: actions/download-artifact@v8
        with:
          pattern: alhangeul-updater-*-x64
          path: updater-release
          merge-multiple: true

      - name: Create complete release inventory
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          pnpm run check:updater-artifacts -- \
            --root updater-release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY \
            --write-inventory updater-inventory/alhangeul-updater-release-inventory.json

      - name: Upload verified updater release inventory
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-updater-release-inventory
          path: updater-inventory/alhangeul-updater-release-inventory.json
          if-no-files-found: error
          retention-days: 14

  publish-updater:
    name: Publish verified updater release
    needs: [build-updater, verify-updater-release]
    if: ${{ inputs.mode == 'updater' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact publish source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref }}
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tracked updater release config
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATER_CONFIG: ${{ github.workspace }}/apps/desktop/src-tauri/tauri.updater.conf.json
        run: |
          set -euo pipefail
          pnpm run check:product-version
          pnpm run check:release-metadata
          source_version="$(node -p "require('./package.json').version")"
          [[ "$source_version" == "$RELEASE_VERSION" ]]
          public_key="$(node -p "require(process.env.UPDATER_CONFIG).plugins.updater.pubkey")"
          [[ -n "$public_key" ]]
          printf 'TAURI_UPDATER_PUBLIC_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"

      - name: Download verified updater slices
        uses: actions/download-artifact@v8
        with:
          pattern: alhangeul-updater-*-x64
          path: updater-release
          merge-multiple: true

      - name: Create complete release inventory
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          pnpm run check:updater-artifacts -- \
            --root updater-release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --public-key-env TAURI_UPDATER_PUBLIC_KEY \
            --write-inventory updater-release/alhangeul-updater-release-inventory.json

      - name: Publish exact GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SOURCE_SHA: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          existing_sha=""
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi
          if [[ -n "$existing_sha" && "$existing_sha" != "$SOURCE_SHA" ]]; then
            echo "Existing tag does not match exact source SHA" >&2
            exit 1
          fi
          mapfile -t assets < <(find updater-release -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.sig' \
              -o -name 'alhangeul-updater-release-inventory.json' \) -print | sort)
          [[ "${#assets[@]}" -eq 7 ]]
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$SOURCE_SHA" \
            --title "Alhangeul $RELEASE_VERSION" \
            --notes "$RELEASE_NOTES"

  updater-linux-window-probe:
    name: Diagnose Linux window automation only
    if: ${{ inputs.mode == 'updater-linux-window-probe' || inputs.mode == 'updater-linux-window-verify' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alhangeul-updater-linux-window-probe.yml
    with:
      candidate_sha: ${{ inputs.acceptance_candidate_sha }}
      d1_run_id: ${{ inputs.acceptance_d1_run_id }}
      verify_fix: ${{ inputs.mode == 'updater-linux-window-verify' }}

  updater-native-acceptance:
    name: Run updater native acceptance
    if: ${{ inputs.mode == 'updater-native-acceptance' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alhangeul-updater-native-acceptance.yml
    with:
      candidate_sha: ${{ inputs.acceptance_candidate_sha }}
      d1_run_id: ${{ inputs.acceptance_d1_run_id }}
      candidate_artifact_id: ${{ inputs.acceptance_candidate_artifact_id }}
      candidate_artifact_digest: ${{ inputs.acceptance_candidate_artifact_digest }}
      release_tag: ${{ inputs.acceptance_release_tag }}

  updater-native-negative-acceptance:
    name: Run updater native negative acceptance
    if: ${{ inputs.mode == 'updater-native-negative-acceptance' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alhangeul-updater-native-negative-acceptance.yml
    with:
      candidate_sha: ${{ inputs.acceptance_candidate_sha }}
      d1_run_id: ${{ inputs.acceptance_d1_run_id }}
      candidate_artifact_id: ${{ inputs.acceptance_candidate_artifact_id }}
      candidate_artifact_digest: ${{ inputs.acceptance_candidate_artifact_digest }}
      release_tag: ${{ inputs.acceptance_release_tag }}
      scenario: ${{ inputs.acceptance_negative_scenario }}
      manifest_sha256: ${{ inputs.acceptance_manifest_sha256 }}
