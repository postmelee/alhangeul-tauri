name: Alhangeul native artifact platform
on:
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: true
      matrix:
        type: string
        required: true
      run_tests:
        type: boolean
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      support_artifact_id:
        value: ${{ jobs.build.outputs.support_artifact_id }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "24"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    outputs:
      artifact_id: ${{ steps.bundle-upload.outputs.artifact-id }}
      support_artifact_id: ${{ steps.support-upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          submodules: true

      - name: Verify checked out commit
        shell: bash
        env:
          EXPECTED_BUILD_REF: ${{ inputs.build_ref || github.sha }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse "${EXPECTED_BUILD_REF}^{commit}")"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Checked out commit mismatch: $actual_sha != $expected_sha" >&2
            exit 1
          fi
          echo "Building commit: $actual_sha"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            rpm \
            shared-mime-info \
            time \
            xdg-utils \
            zip

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: desktop-${{ matrix.name }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            desktop-${{ matrix.name }}-pnpm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo workload
        uses: ./.github/actions/cargo-cache
        with:
          scope: desktop
          target: ${{ matrix.target }}
          paths: apps/desktop/src-tauri/target

      - name: Prepare Linux thumbnailer evidence
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"

      - name: Build Linux thumbnailer
        id: build-linux-thumbnailer
        if: startsWith(matrix.name, 'linux-')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:linux-thumbnailer -- \
            --target "${{ matrix.target }}" \
            --output "diagnostics/linux-thumbnailer-${{ matrix.name }}" \
            --repository-sha "$(git rev-parse HEAD)"

      - name: Record Linux thumbnailer build outcome
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-${{ matrix.name }}
          BUILD_OUTCOME: ${{ steps.build-linux-thumbnailer.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"build":"%s","repositorySha":"%s","runner":"%s"}\n' \
            "$BUILD_OUTCOME" "$(git rev-parse HEAD)" "${{ matrix.name }}" \
            > "$OUTPUT_ROOT/step-outcomes.json"

      - name: Upload Linux thumbnailer evidence
        id: upload-linux-thumbnailer-evidence
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnailer
          path: diagnostics/linux-thumbnailer-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Linux thumbnailer build success
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build-linux-thumbnailer.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-linux-thumbnailer-evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "$BUILD_OUTCOME" == success ]]
          [[ "$UPLOAD_OUTCOME" == success ]]

      - name: Stage Linux thumbnailer package resources
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0755 \
            "diagnostics/linux-thumbnailer-${{ matrix.name }}/alhangeul-thumbnailer" \
            apps/desktop/src-tauri/linux/thumbnail-resources/alhangeul-thumbnailer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test document preview Rust
        if: inputs.run_tests
        run: pnpm run test:document-preview

      - name: Lint document preview Rust
        if: inputs.run_tests
        run: pnpm run clippy:document-preview

      - name: Lint document preview protocol-only Rust
        if: inputs.run_tests
        run: pnpm run clippy:document-preview:protocol

      - name: Test Linux thumbnailer
        id: test-linux-thumbnailer
        if: inputs.run_tests && startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          pnpm run test:linux-thumbnailer 2>&1 | tee "$OUTPUT_ROOT/tests.log"

      - name: Lint Linux thumbnailer
        id: lint-linux-thumbnailer
        if: inputs.run_tests && startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          cargo fmt --manifest-path apps/linux-thumbnailer/Cargo.toml -- --check 2>&1 | tee "$OUTPUT_ROOT/fmt.log"
          pnpm run clippy:linux-thumbnailer 2>&1 | tee "$OUTPUT_ROOT/clippy.log"

      - name: Record Linux thumbnailer test outcome
        if: ${{ always() && inputs.run_tests && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}
          TEST_OUTCOME: ${{ steps.test-linux-thumbnailer.outcome }}
          LINT_OUTCOME: ${{ steps.lint-linux-thumbnailer.outcome }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"schemaVersion":1,"repositorySha":"%s","workflowSha":"%s","runId":"%s","runAttempt":"%s","runner":"%s","target":"%s","test":"%s","lint":"%s"}\n' \
            "$(git rev-parse HEAD)" "$WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_NAME" "$BUILD_TARGET" "$TEST_OUTCOME" "$LINT_OUTCOME" \
            > "$OUTPUT_ROOT/step-outcomes.json"

      - name: Upload Linux thumbnailer test evidence
        if: ${{ always() && inputs.run_tests && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnailer-tests
          path: diagnostics/linux-thumbnailer-tests-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows thumbnail binaries
        if: matrix.name == 'windows-x64'
        run: pnpm run build:thumbnail-binaries -- --target x86_64-pc-windows-msvc

      - name: Test desktop Rust
        if: inputs.run_tests
        run: pnpm run test:desktop

      - name: Lint desktop Rust
        if: inputs.run_tests
        run: pnpm run clippy:desktop

      - name: Test Windows thumbnail worker
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run test:thumbnail-worker:windows

      - name: Test Windows thumbnail handler
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run test:thumbnail-handler:windows

      - name: Lint Windows thumbnail worker
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run clippy:thumbnail-worker:windows

      - name: Lint Windows thumbnail handler
        if: inputs.run_tests && matrix.name == 'windows-x64'
        run: pnpm run clippy:thumbnail-handler:windows

      - name: Build Tauri bundles
        shell: bash
        run: pnpm tauri build --verbose --target "${{ matrix.target }}" ${{ matrix.bundle_args }}

      - name: Prepare Linux thumbnail package diagnostics
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnail-package-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"

      - name: Run Linux thumbnail package lifecycle
        id: linux-thumbnail-package-smoke
        if: startsWith(matrix.name, 'linux-')
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          ALHANGEUL_PACKAGE_SMOKE_ALLOW_SYSTEM: "1"
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          OUTPUT_ROOT: diagnostics/linux-thumbnail-package-${{ matrix.name }}
        run: |
          set -euo pipefail
          evidence="$BUNDLE_ROOT/verification/linux-thumbnail-packages.json"
          bash scripts/linux-thumbnail-mime-smoke.sh "$GITHUB_WORKSPACE" "$OUTPUT_ROOT/mime-canary.json" \
            2>&1 | tee "$OUTPUT_ROOT/mime-canary.log"
          bash scripts/linux-thumbnail-package-smoke.sh \
            --platform "${{ matrix.name }}" \
            --bundle-root "$BUNDLE_ROOT" \
            --helper apps/desktop/src-tauri/linux/thumbnail-resources/alhangeul-thumbnailer \
            --repository-sha "$(git rev-parse HEAD)" \
            --evidence "$evidence" \
            2>&1 | tee "$OUTPUT_ROOT/lifecycle.log"
          cp "$evidence" "$OUTPUT_ROOT/"

      - name: Record Linux thumbnail package outcome
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          OUTPUT_ROOT: diagnostics/linux-thumbnail-package-${{ matrix.name }}
          SMOKE_OUTCOME: ${{ steps.linux-thumbnail-package-smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          printf '{"smoke":"%s","repositorySha":"%s","runner":"%s"}\n' \
            "$SMOKE_OUTCOME" "$(git rev-parse HEAD)" "${{ matrix.name }}" \
            > "$OUTPUT_ROOT/step-outcomes.json"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/verification"
          if [[ -d "$bundle" ]]; then
            find "$bundle" -maxdepth 1 -name 'linux-thumbnail-packages.json*' -exec cp {} "$OUTPUT_ROOT/" \;
          fi

      - name: Upload Linux thumbnail package evidence
        id: upload-linux-thumbnail-package-evidence
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-${{ matrix.name }}-thumbnail-package
          path: diagnostics/linux-thumbnail-package-${{ matrix.name }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Require Linux thumbnail package success
        if: ${{ always() && startsWith(matrix.name, 'linux-') }}
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.linux-thumbnail-package-smoke.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-linux-thumbnail-package-evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_OUTCOME" == success ]]
          [[ "$UPLOAD_OUTCOME" == success ]]

      - name: Stage Windows thumbnail verification copies
        if: matrix.name == 'windows-x64'
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_ROOT/verification"
          cp \
            apps/desktop/src-tauri/windows/thumbnail-resources/AlhangeulThumbnailHandler.dll \
            "$BUNDLE_ROOT/verification/AlhangeulThumbnailHandler.dll"
          cp \
            apps/desktop/src-tauri/windows/thumbnail-resources/AlhangeulThumbnailWorker.exe \
            "$BUNDLE_ROOT/verification/AlhangeulThumbnailWorker.exe"

      - name: Verify bundle artifact
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          pnpm run check:desktop-artifacts -- \
            --platform "${{ matrix.name }}" \
            --root "$BUNDLE_ROOT" \
            --source-sha "$(git rev-parse HEAD)" \
            --write-inventory "$BUNDLE_ROOT/alhangeul-artifact-inventory.json"

      - name: Build Windows thumbnail support package
        if: matrix.name == 'windows-x64'
        shell: bash
        env:
          BUNDLE_ROOT: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          node scripts/build-windows-thumbnail-support.mjs \
            --inventory "$BUNDLE_ROOT/alhangeul-artifact-inventory.json" \
            --output thumbnail-support-output

      - name: Upload Windows thumbnail support package
        id: support-upload
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-windows-x64-thumbnail-support
          path: thumbnail-support-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle artifact
        id: bundle-upload
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-desktop-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14
