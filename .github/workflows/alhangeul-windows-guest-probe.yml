name: Alhangeul Windows 11 guest observation
on:
  workflow_call:
    inputs:
      scenario:
        type: string
        default: nsis
permissions:
  contents: read
  actions: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      GUEST_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Select disposable runner storage
        run: |
          echo "HOSTED_UI_ROOT=$RUNNER_TEMP/alh-windows-guest" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/alh-windows-guest/evidence"
          echo "{\"phase\":\"host-preparation\",\"releaseAcceptance\":\"unverified\"}" > "$RUNNER_TEMP/alh-windows-guest/evidence/preparation.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install signed Ubuntu virtualization packages
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/ci/ubuntu-mirror.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm xorriso acl aria2
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Download exact existing product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/hosted-ui-input.mjs
      - name: Download and verify official evaluation ISO
        timeout-minutes: 31
        run: python3 -B scripts/ci/guest-ui-prepare.py iso
      - name: Build private input media from exact product and fixtures
        timeout-minutes: 10
        run: python3 -B scripts/ci/guest-ui-prepare.py media
      - name: Start owned offline Windows 11 guest
        run: python3 -B scripts/ci/guest-ui-lifecycle.py start
      - name: Collect five minute checkpoint
        run: python3 -B scripts/ci/guest-ui-lifecycle.py checkpoint 300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows11-guest-checkpoint-5
          path: ${{ env.HOSTED_UI_ROOT }}/checkpoint/**
          if-no-files-found: error
          retention-days: 7
      - name: Collect twenty minute checkpoint
        run: python3 -B scripts/ci/guest-ui-lifecycle.py checkpoint 900
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows11-guest-checkpoint-20
          path: ${{ env.HOSTED_UI_ROOT }}/checkpoint/**
          if-no-files-found: error
          retention-days: 7
      - name: Wait for standard user observation
        run: python3 -B scripts/ci/guest-ui-lifecycle.py wait
      - name: Stop only this run's owned processes
        if: ${{ always() }}
        run: python3 -B scripts/ci/guest-ui-lifecycle.py stop
      - name: Preserve only public-fixture observation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows11-guest-observation
          path: ${{ env.HOSTED_UI_ROOT }}/evidence/**
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable evaluation disk and credentials
        if: ${{ always() }}
        run: |
          python3 -B scripts/ci/guest-ui-lifecycle.py remove
          echo 'Windows 11 guest observation only. Windows 10 and release acceptance remain unverified.' >> "$GITHUB_STEP_SUMMARY"
