name: Alhangeul fast validation

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  contracts:
    name: Fast Node and Studio contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm run fetch:rhwp-pin-tag
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:product-boundary
      - run: pnpm run check:product-version
      - run: pnpm run check:release-metadata
      - run: pnpm run check:rhwp-pin
      - run: pnpm run check:committed-rhwp
      - run: pnpm run test:automation
      - run: pnpm run typecheck:gui
      - run: pnpm run test:upstream
      - run: pnpm run test:studio
      - run: pnpm run build:studio
      - name: Record limited scope
        run: echo 'Fast contracts passed; native/package/GUI/updater are unverified by this job.' >> "$GITHUB_STEP_SUMMARY"

  windows-scripts:
    name: Fast Windows PowerShell contracts
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Parse PowerShell and run isolated regressions
        shell: powershell
        run: .\scripts\ci\windows-tests.ps1
      - name: Record limited scope
        shell: powershell
        run: Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Windows script contracts passed; installer and COM activation remain unverified.'
      - name: Preserve Windows script regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alhangeul-fast-windows-script-contracts
          path: diagnostics/windows-script-contracts/**
          if-no-files-found: warn
          retention-days: 14
