name: Alhangeul Windows Dialog Policy and Probe

on:
  workflow_call:
    inputs:
      verify:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dialog-probe:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      EVIDENCE_ROOT: ${{ github.workspace }}\dialog-evidence
      HARNESS_SHA: ${{ github.workflow_sha }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify harness and parse PowerShell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:EVIDENCE_ROOT | Out-Null
          "CLEANUP_STATE=$env:RUNNER_TEMP\alhangeul-dialog-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          if ((git rev-parse HEAD) -ne $env:HARNESS_SHA) { throw 'Harness mismatch' }
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'Expected Windows PowerShell 5.1'
          }
          @{ harnessSha = $env:HARNESS_SHA; runId = $env:GITHUB_RUN_ID;
             imageVersion = $env:ImageVersion; os = [Environment]::OSVersion.Version.ToString();
             powerShell = $PSVersionTable.PSVersion.ToString(); productTested = $false } |
            ConvertTo-Json | Set-Content "$env:EVIDENCE_ROOT/context.json" -Encoding UTF8
          $files = @(Get-ChildItem scripts/windows-pdf-*.ps1) +
            @(Get-ChildItem tests/gui/windows-dialog/*.ps1) + @(Get-Item tests/windows-pdf-dialog-policy.test.ps1) +
            @(Get-Item tests/windows-pdf-native-diagnostics.test.ps1)
          foreach ($file in $files) {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed: $($file.Name)" }
          }
      - name: Execute real policy functions
        run: |
          & ./tests/windows-pdf-dialog-policy.test.ps1 -EvidencePath "$env:EVIDENCE_ROOT/policy.json"
          if ($LASTEXITCODE -ne 0) { throw 'Policy tests failed' }
      - name: Verify native guard diagnostics
        run: |
          & ./tests/windows-pdf-native-diagnostics.test.ps1 -EvidencePath "$env:EVIDENCE_ROOT/native-diagnostics.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostics tests failed' }
      - name: Compile native helper and observe controlled dialog
        if: ${{ !inputs.verify }}
        timeout-minutes: 3
        run: |
          & ./tests/gui/windows-dialog/probe.ps1 -EvidencePath "$env:EVIDENCE_ROOT/probe.json" -CleanupStatePath $env:CLEANUP_STATE
      - name: Verify controlled dialog postconditions
        if: ${{ inputs.verify }}
        timeout-minutes: 3
        run: |
          & ./tests/gui/windows-dialog/integration.ps1 -EvidencePath "$env:EVIDENCE_ROOT/integration.json" -CleanupStatePath $env:CLEANUP_STATE
      - name: Clean only owned fixture resources
        if: ${{ always() }}
        run: |
          if (Test-Path ./tests/gui/windows-dialog/cleanup.ps1) {
            New-Item -ItemType Directory -Path $env:EVIDENCE_ROOT -Force | Out-Null
            & ./tests/gui/windows-dialog/cleanup.ps1 -CleanupStatePath $env:CLEANUP_STATE -EvidencePath "$env:EVIDENCE_ROOT/cleanup.json"
          }
      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dialog-probe-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 7
