name: Alhangeul Linux GUI Acceptance

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Exact 40-character commit SHA to accept.
        required: true
        type: string
      native_run_id:
        description: Successful Alhangeul Desktop Artifact Build run ID for build_ref.
        required: true
        type: string

permissions:
  actions: read
  contents: read
concurrency:
  group: alhangeul-linux-gui-${{ inputs.build_ref }}-${{ inputs.native_run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  TAURI_DRIVER_VERSION: "2.0.6"
  GUI_TIMEOUT_MS: "120000"

jobs:
  accept-linux-x64:
    name: Accept Linux x64 GUI
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/linux-x64
      EVIDENCE_ROOT: /home/runner/PDF
      CUPS_PDF_OUTPUT: /home/runner/PDF/cups-output/biz_plan.pdf
    steps:
      - name: Validate dispatch inputs
        id: validate-inputs
        shell: bash
        env:
          ACCEPTANCE_REF: ${{ github.workflow_sha }}
          BUILD_REF: ${{ inputs.build_ref }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTANCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NATIVE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout exact acceptance source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          submodules: true

      - name: Prepare evidence context
        id: prepare-evidence
        if: ${{ always() }}
        shell: bash
        env:
          ACCEPTANCE_REF: ${{ github.workflow_sha }}
          BUILD_REF: ${{ inputs.build_ref }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT/generated"
          printf '{"acceptanceRef":"%s","workflowRef":"%s","buildRef":"%s","nativeRunId":"%s","acceptanceRunId":"%s","runAttempt":"%s"}\n' \
            "$ACCEPTANCE_REF" "$WORKFLOW_REF" "$BUILD_REF" "$NATIVE_RUN_ID" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$EVIDENCE_ROOT/workflow-context.json"

      - name: Verify checked out exact SHA
        id: verify-source
        shell: bash
        env:
          ACCEPTANCE_REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$ACCEPTANCE_REF" ]]
          printf '%s\n' "$actual_sha" > "$EVIDENCE_ROOT/checked-out-sha.txt"

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify native run and exact artifact handoff
        id: handoff
        shell: bash
        env:
          BUILD_REF: ${{ inputs.build_ref }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-workflow-artifact.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --build-ref "$BUILD_REF" \
            --run-id "$NATIVE_RUN_ID" \
            --workflow-path .github/workflows/alhangeul-desktop.yml \
            --artifact-name alhangeul-desktop-linux-x64 \
            --json-output "$EVIDENCE_ROOT/artifact-handoff.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download verified Linux x64 artifact
        id: download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.handoff.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          digest-mismatch: error

      - name: Install pnpm dependencies
        id: install-pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          printf 'product_version=%s\n' "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify artifact inventory and select one DEB
        id: verify-inventory
        shell: bash
        run: |
          set -euo pipefail
          pnpm run check:desktop-artifacts -- \
            --platform linux-x64 \
            --root "$ARTIFACT_ROOT" \
            --verify-inventory "$ARTIFACT_ROOT/alhangeul-artifact-inventory.json"
          mapfile -d '' packages < <(find "$ARTIFACT_ROOT/deb" -maxdepth 1 -type f -name '*.deb' -print0)
          [[ "${#packages[@]}" -eq 1 ]]
          printf 'deb_path=%s\n' "${packages[0]}" >> "$GITHUB_OUTPUT"
          sha256sum "${packages[0]}" > "$EVIDENCE_ROOT/installed-deb.sha256"
          cp "$ARTIFACT_ROOT/alhangeul-artifact-inventory.json" "$EVIDENCE_ROOT/"

      - name: Install Linux GUI dependencies
        id: install-linux-dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            cups \
            dbus-x11 \
            fonts-noto-cjk \
            fonts-unfonts-core \
            gir1.2-gtk-3.0 \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            nautilus \
            openbox \
            poppler-utils \
            printer-driver-cups-pdf \
            python3-gi \
            python3-pyatspi \
            scrot \
            shared-mime-info \
            thunar \
            tumbler \
            webkit2gtk-driver \
            xdotool \
            xvfb

      - name: Run Linux thumbnail manager contract probe
        id: thumbnail-manager-probe
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          THUMBNAIL_EVIDENCE_ROOT: ${{ env.EVIDENCE_ROOT }}/thumbnail-manager
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d "$RUNNER_TEMP/alhangeul-thumbnail-manager.XXXXXX")"
          trap 'rm -rf "$probe_root"' EXIT
          install -d "$THUMBNAIL_EVIDENCE_ROOT" "$probe_root/data/mime/packages" \
            "$probe_root/data/thumbnailers" "$probe_root/source"
          cp third_party/rhwp/saved/blank2010.hwp "$probe_root/source/probe.hwp"
          cp third_party/rhwp/saved/blank_hwpx.hwpx "$probe_root/source/probe.hwpx"
          head -c 64 "$probe_root/source/probe.hwp" > "$probe_root/source/probe-fail.hwp"
          source_hashes_before="$(sha256sum "$probe_root/source/probe.hwp" \
            "$probe_root/source/probe.hwpx" "$probe_root/source/probe-fail.hwp" | awk '{print $1}')"
          fail_hash="$(sha256sum "$probe_root/source/probe-fail.hwp" | awk '{print $1}')"
          cat > "$probe_root/data/mime/packages/alhangeul-probe.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <mime-info xmlns="http://www.freedesktop.org/standards/shared-mime-info">
            <mime-type type="application/x-hwp"><glob pattern="*.hwp" weight="100"/></mime-type>
            <mime-type type="application/vnd.hancom.hwpx"><glob pattern="*.hwpx" weight="100"/></mime-type>
          </mime-info>
          XML
          XDG_DATA_HOME="$probe_root/data" update-mime-database "$probe_root/data/mime"
          stub="$probe_root/alhangeul-thumbnail-stub"
          cat > "$stub" <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail
          sha="$(sha256sum "$1" | awk '{print $1}')"
          result=success
          if [[ "$sha" == "$ALHANGEUL_THUMBNAIL_FAIL_SHA" ]]; then
            printf partial-output > "$2"
            result=partial-exit-42
          else
            printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
              | base64 --decode > "$2"
          fi
          printf '{"sha256":"%s","edge":%s,"result":"%s"}\n' "$sha" "$3" "$result" \
            >> "$ALHANGEUL_THUMBNAIL_INVOCATIONS"
          [[ "$result" == success ]] || exit 42
          STUB
          chmod 0755 "$stub"
          printf '[Thumbnailer Entry]\nTryExec=%s\nExec=%s %%i %%o %%s\nMimeType=application/x-hwp;application/vnd.hancom.hwpx;\n' \
            "$stub" "$stub" > "$probe_root/data/thumbnailers/alhangeul-probe.thumbnailer"
          hwp_type="$(XDG_DATA_HOME="$probe_root/data" gio info -a standard::content-type \
            "$probe_root/source/probe.hwp" | sed -n 's/.*standard::content-type: //p')"
          hwpx_type="$(XDG_DATA_HOME="$probe_root/data" gio info -a standard::content-type \
            "$probe_root/source/probe.hwpx" | sed -n 's/.*standard::content-type: //p')"
          [[ "$hwp_type" == application/x-hwp ]]
          [[ "$hwpx_type" == application/vnd.hancom.hwpx ]]
          run_manager() {
            local manager="$1" manager_root="$probe_root/$1" summary="$THUMBNAIL_EVIDENCE_ROOT/$1.json"
            local status=0
            install -d "$manager_root/cache" "$manager_root/config" "$manager_root/files" \
              "$manager_root/home" "$manager_root/logs" "$manager_root/runtime"
            chmod 0700 "$manager_root/runtime"
            touch "$manager_root/home/.gtk-bookmarks"
            cp "$probe_root/source/probe.hwp" "$manager_root/files/probe.hwp"
            cp "$probe_root/source/probe.hwpx" "$manager_root/files/probe.hwpx"
            cp "$probe_root/source/probe-fail.hwp" "$manager_root/files/probe-fail.hwp"
            : > "$manager_root/invocations.ndjson"
            # shellcheck disable=SC2016
            HOME="$manager_root/home" XDG_CONFIG_HOME="$manager_root/config" \
              XDG_DATA_HOME="$probe_root/data" XDG_CACHE_HOME="$manager_root/cache" \
              XDG_RUNTIME_DIR="$manager_root/runtime" \
              ALHANGEUL_THUMBNAIL_INVOCATIONS="$manager_root/invocations.ndjson" \
              ALHANGEUL_THUMBNAIL_FAIL_SHA="$fail_hash" \
              xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
              dbus-run-session -- bash -euo pipefail -c '
                manager="$1"; files="$2"; log="$3"; summary="$4"
                openbox >"$summary.openbox.log" 2>&1 & window_manager_pid=$!
                trap '\''kill "$window_manager_pid" 2>/dev/null || true'\'' EXIT
                if [[ "$manager" == nautilus ]]; then
                  gsettings set org.gnome.nautilus.preferences show-image-thumbnails always
                  gsettings set org.gnome.desktop.thumbnailers disable-all false
                  # Stage 1 keeps the executable outside /usr. GNOME normally exposes only
                  # /usr plus input/output to bwrap, so this probe-only marker selects the
                  # upstream no-nested-sandbox path used when the caller is already sandboxed.
                  export SNAP_NAME=alhangeul-thumbnail-probe
                fi
                launch() {
                  local phase="$1" expected_delta="$2" wait_seconds="$3"
                  local before after deadline
                  before="$(wc -l < "$log")"
                  G_MESSAGES_DEBUG=all "$manager" "$files" \
                    >"$summary.$phase.stdout.log" 2>"$summary.$phase.stderr.log" & pid=$!
                  if (( expected_delta == 0 )); then
                    sleep "$wait_seconds"
                  else
                    deadline=$((SECONDS + wait_seconds))
                    while (( SECONDS < deadline )); do
                      after="$(wc -l < "$log")"
                      if (( after >= before + expected_delta )); then
                        break
                      fi
                      sleep 1
                    done
                  fi
                  scrot "$summary.$phase.png"
                  "$manager" --quit >/dev/null 2>&1 || true
                  wait "$pid" || true
                }
                result_count() {
                  local result="$1"
                  awk -v needle="\"result\":\"$result\"" \
                    "index(\$0, needle) { count += 1 } END { print count + 0 }" "$log"
                }
                launch first 3 20
                first="$(wc -l < "$log")"
                first_success="$(result_count success)"
                first_failure="$(result_count partial-exit-42)"
                launch cached 0 5
                cached="$(wc -l < "$log")"
                cached_success="$(result_count success)"
                cached_failure="$(result_count partial-exit-42)"
                touch "$files/probe.hwp" "$files/probe.hwpx" "$files/probe-fail.hwp"
                launch changed 2 20
                changed="$(wc -l < "$log")"
                changed_success="$(result_count success)"
                changed_failure="$(result_count partial-exit-42)"
                printf '\''{"manager":"%s","first":%s,"cached":%s,"changed":%s,"success":{"first":%s,"cached":%s,"changed":%s},"failure":{"first":%s,"cached":%s,"changed":%s}}\n'\'' \
                  "$manager" "$first" "$cached" "$changed" \
                  "$first_success" "$cached_success" "$changed_success" \
                  "$first_failure" "$cached_failure" "$changed_failure" > "$summary"
                [[ "$first_success" -eq 2 ]]
                [[ "$first_failure" -ge 1 ]]
                [[ "$cached_success" -eq "$first_success" ]]
                [[ "$changed_success" -ge $((cached_success + 2)) ]]
              ' bash "$manager" "$manager_root/files" "$manager_root/invocations.ndjson" "$summary"
            status=$?
            find "$manager_root/cache" -type f -printf '%f %s\n' | sort \
              > "$THUMBNAIL_EVIDENCE_ROOT/$manager-cache.txt"
            cp "$manager_root/invocations.ndjson" "$THUMBNAIL_EVIDENCE_ROOT/$manager-invocations.ndjson"
            return "$status"
          }
          nautilus_status=0
          thunar_status=0
          run_manager nautilus || nautilus_status=$?
          run_manager thunar || thunar_status=$?
          source_hashes_after="$(sha256sum "$probe_root/source/probe.hwp" \
            "$probe_root/source/probe.hwpx" "$probe_root/source/probe-fail.hwp" | awk '{print $1}')"
          [[ "$source_hashes_before" == "$source_hashes_after" ]]
          {
            nautilus --version
            thunar --version
            tumblerd --version 2>&1 || true
            printf 'hwp %s\n' "$hwp_type"
            printf 'hwpx %s\n' "$hwpx_type"
            printf 'nautilus_status %s\n' "$nautilus_status"
            printf 'thunar_status %s\n' "$thunar_status"
            printf 'gnome_probe_sandbox disposable-executable-snap-marker\n'
          } > "$THUMBNAIL_EVIDENCE_ROOT/environment.txt"
          [[ "$nautilus_status" -eq 0 && "$thunar_status" -eq 0 ]]

      - name: Install exact tauri-driver
        id: install-tauri-driver
        shell: bash
        run: cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked

      - name: Install verified DEB
        id: install-deb
        shell: bash
        env:
          DEB_PATH: ${{ steps.verify-inventory.outputs.deb_path }}
        run: |
          set -euo pipefail
          sudo apt-get install -y "$DEB_PATH"
          command -v Alhangeul

      - name: Configure CUPS-PDF
        id: configure-cups
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(dirname "$CUPS_PDF_OUTPUT")"
          install -d -m 0777 "$output_dir"
          printf 'a4\n' | sudo tee /etc/papersize >/dev/null
          config=/etc/cups/cups-pdf.conf
          directive_pattern='^[[:space:]]*#?[[:space:]]*(Out|Label)[[:space:]]'
          echo 'CUPS-PDF directives before normalization:'
          grep -En "$directive_pattern" "$config" || true
          sudo sed -Ei '/^[[:space:]]*(Out|Label)[[:space:]]/d' "$config"
          printf 'Out %s\nLabel 0\n' "$output_dir" | sudo tee -a "$config" >/dev/null
          echo 'CUPS-PDF directives after normalization:'
          grep -En "$directive_pattern" "$config" || true
          grep -Fqx "Out $output_dir" "$config"
          grep -Fqx 'Label 0' "$config"
          sudo service cups restart
          if ! lpstat -p PDF >/dev/null 2>&1; then
            sudo lpadmin -p PDF -E -v cups-pdf:/ \
              -P /usr/share/ppd/cups-pdf/CUPS-PDF.ppd
          fi
          sudo lpadmin -p PDF -o PageSize=A4
          sudo cupsenable PDF
          sudo cupsaccept PDF
          lpstat -p PDF
          queue_options="$(lpoptions -p PDF)"
          page_size_options="$(lpoptions -p PDF -l | grep -E '^PageSize/')"
          printf 'CUPS-PDF queue options: %s\n' "$queue_options"
          printf 'CUPS-PDF PageSize options: %s\n' "$page_size_options"
          printf '%s\n' "$page_size_options" \
            | grep -Eq '(^|[[:space:]])\*(A4|iso_a4_210x297mm)([[:space:]]|$)'

      - name: Record native environment
        id: record-environment
        shell: bash
        run: |
          set -euo pipefail
          webkit_webdriver_path="$(command -v WebKitWebDriver)"
          {
            node --version
            pnpm --version
            rustc --version
            cargo --version
            printf 'tauri-driver %s\n' "$TAURI_DRIVER_VERSION"
            printf 'WebKitWebDriver %s\n' "$webkit_webdriver_path"
            dpkg-query -W cups libgtk-3-0 libwebkit2gtk-4.1-0 webkit2gtk-driver
            pdfinfo -v 2>&1 | head -n 1
          } > "$EVIDENCE_ROOT/native-environment.txt"

      - name: Run Linux GUI acceptance
        id: run-gui
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        env:
          ALHANGEUL_GUI_APP_PATH: /usr/bin/Alhangeul
          ALHANGEUL_GUI_BUILD_REF: ${{ inputs.build_ref }}
          ALHANGEUL_GUI_NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          ALHANGEUL_GUI_DRIVER_PATH: /home/runner/.cargo/bin/tauri-driver
          ALHANGEUL_GUI_FIXTURE_ROOT: ${{ github.workspace }}
          ALHANGEUL_GUI_OUTPUT_DIR: ${{ env.EVIDENCE_ROOT }}
          ALHANGEUL_GUI_TIMEOUT_MS: ${{ env.GUI_TIMEOUT_MS }}
          ALHANGEUL_GUI_APP_VERSION: ${{ steps.install-pnpm.outputs.product_version }}
          ALHANGEUL_GUI_DRIVER_VERSION: "tauri-driver ${{ env.TAURI_DRIVER_VERSION }}"
          ALHANGEUL_GUI_CUPS_PDF_OUTPUT: ${{ env.CUPS_PDF_OUTPUT }}
          ALHANGEUL_GUI_CUPS_PDF_PRINTER: PDF
          NO_AT_BRIDGE: "0"
          GTK_MODULES: gail:atk-bridge
        run: |
          set -euo pipefail
          run_isolated_phase() {
            local phase="$1"
            shift
            # shellcheck disable=SC2016
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
              dbus-run-session -- bash -euo pipefail -c '
                phase="$1"
                shift
                openbox >"$ALHANGEUL_GUI_OUTPUT_DIR/openbox-$phase.log" 2>&1 &
                window_manager_pid=$!
                trap '\''kill "$window_manager_pid" 2>/dev/null || true'\'' EXIT
                "$@"
              ' bash "$phase" "$@"
          }
          native_print_status=0
          run_isolated_phase native-print pnpm run test:gui:linux:native-print \
            || native_print_status=$?
          webdriver_status=0
          run_isolated_phase webdriver pnpm run test:gui:linux \
            || webdriver_status=$?
          printf '{"nativePrint":%s,"webdriver":%s}\n' \
            "$native_print_status" "$webdriver_status" \
            > "$ALHANGEUL_GUI_OUTPUT_DIR/gui-phase-outcomes.json"
          [[ "$native_print_status" -eq 0 && "$webdriver_status" -eq 0 ]]

      - name: Record acceptance outcomes
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATE: ${{ steps.validate-inputs.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          SOURCE: ${{ steps.verify-source.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          DOWNLOAD: ${{ steps.download-artifact.outcome }}
          INVENTORY: ${{ steps.verify-inventory.outcome }}
          INSTALL: ${{ steps.install-deb.outcome }}
          THUMBNAIL_MANAGER: ${{ steps.thumbnail-manager-probe.outcome }}
          GUI: ${{ steps.run-gui.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          printf '{"validate":"%s","checkout":"%s","source":"%s","handoff":"%s","download":"%s","inventory":"%s","install":"%s","thumbnailManager":"%s","gui":"%s"}\n' \
            "$VALIDATE" "$CHECKOUT" "$SOURCE" "$HANDOFF" "$DOWNLOAD" \
            "$INVENTORY" "$INSTALL" "$THUMBNAIL_MANAGER" "$GUI" > "$EVIDENCE_ROOT/step-outcomes.json"

      - name: Upload Linux GUI evidence
        id: upload-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alhangeul-linux-gui-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 7

      - name: Require Linux GUI acceptance success
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATE: ${{ steps.validate-inputs.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          PREPARE: ${{ steps.prepare-evidence.outcome }}
          SOURCE: ${{ steps.verify-source.outcome }}
          NODE: ${{ steps.setup-node.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          DOWNLOAD: ${{ steps.download-artifact.outcome }}
          PNPM: ${{ steps.install-pnpm.outcome }}
          INVENTORY: ${{ steps.verify-inventory.outcome }}
          LINUX_DEPS: ${{ steps.install-linux-dependencies.outcome }}
          THUMBNAIL_MANAGER: ${{ steps.thumbnail-manager-probe.outcome }}
          DRIVER: ${{ steps.install-tauri-driver.outcome }}
          INSTALL: ${{ steps.install-deb.outcome }}
          CUPS: ${{ steps.configure-cups.outcome }}
          ENVIRONMENT: ${{ steps.record-environment.outcome }}
          GUI: ${{ steps.run-gui.outcome }}
          UPLOAD: ${{ steps.upload-evidence.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$VALIDATE" "$CHECKOUT" "$PREPARE" "$SOURCE" "$NODE" "$HANDOFF" \
            "$DOWNLOAD" "$PNPM" "$INVENTORY" "$LINUX_DEPS" "$DRIVER" \
            "$THUMBNAIL_MANAGER" "$INSTALL" "$CUPS" "$ENVIRONMENT" "$GUI" "$UPLOAD"; do
            [[ "$outcome" == success ]]
          done
