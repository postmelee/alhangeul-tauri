name: Bug Report
description: Report a bug in Alhangeul
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing an Alhangeul renderer or document-engine bug, test the same document and steps in the upstream rhwp demo:

        https://edwardkim.github.io/rhwp/

        If the same problem happens there, link or open an upstream issue:

        https://github.com/edwardkim/rhwp/issues

  - type: checkboxes
    id: rhwp-check
    attributes:
      label: Upstream rhwp check
      options:
        - label: I tested the same document and steps in the upstream rhwp demo.
          required: true
    validations:
      required: true

  - type: dropdown
    id: rhwp-result
    attributes:
      label: rhwp demo result
      options:
        - The problem does not happen in rhwp.
        - The same problem happens in rhwp, and I opened or found an upstream issue.
    validations:
      required: true

  - type: input
    id: rhwp-issue
    attributes:
      label: rhwp issue link
      placeholder: "https://github.com/edwardkim/rhwp/issues/..."

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch/Manjaro)
        - Linux (other)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: "e.g. Windows 11 24H2 or Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Build source
      options:
        - Local development build
        - GitHub Actions artifact
        - MSI
        - NSIS
        - AppImage
        - DEB
        - RPM
    validations:
      required: true

  - type: input
    id: alhangeul-version
    attributes:
      label: Alhangeul Version or Commit
      placeholder: "e.g. 0.3.1 or a commit SHA"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. Include screenshots if possible, but do not upload confidential documents.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Terminal output, a non-confidential sample, IME name, display setup, or related issue links.
