[package]
name = "alhangeul-thumbnail-handler"
version = "0.1.0"
edition = "2021"
description = "Windows Explorer thumbnail COM handler for Alhangeul"
license = "MIT"
publish = false

[lib]
name = "alhangeul_thumbnail_handler"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
alhangeul-document-preview = { path = "../../crates/document-preview", default-features = false }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
zip = { version = "8.5", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
