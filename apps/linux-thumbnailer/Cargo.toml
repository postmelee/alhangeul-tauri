[package]
name = "alhangeul-linux-thumbnailer"
version = "0.1.0"
edition = "2021"
description = "Bounded Freedesktop thumbnail renderer for Alhangeul"
license = "MIT"
publish = false

[[bin]]
name = "alhangeul-thumbnailer"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
alhangeul-document-preview = { path = "../../crates/document-preview", default-features = false, features = ["render"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zip = { version = "8.5", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
